name: windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Static release build
        run: |
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -o dist/pgdeploy.exe ./cmd/pgdeploy
        shell: pwsh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Build release binary
        shell: pwsh
        run: |
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $commit = "${{ github.sha }}"
          $buildTime = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
          $ldflags = "-s -w -X github.com/pgdeploy/pgdeploy/internal/version.GitCommit=$commit -X github.com/pgdeploy/pgdeploy/internal/version.BuildTime=$buildTime"
          go build -trimpath -ldflags $ldflags -o dist/pgdeploy.exe ./cmd/pgdeploy
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pgdeploy.exe
